<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctors — MediConnect</title>
<link rel="stylesheet" href="../css/main.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="page-header">
  <div class="container">
    <h1>Our Doctors</h1>
    <p>Find specialists across all departments and hospitals</p>
    <div class="search-bar">
      <span style="padding:10px 16px;color:var(--gray-400);font-size:20px">🔍</span>
      <input type="text" id="search-input" class="form-control" placeholder="Search by specialization (Cardiology, Orthopedics...)">
      <button class="btn btn-primary" onclick="loadDoctors()">Search</button>
    </div>
  </div>
</div>

<div style="padding:32px 0">
  <div class="container">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px">
      <div id="results-count" class="text-muted text-sm">Loading...</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select id="filter-hospital" class="form-control" style="width:auto;padding:6px 28px 6px 10px;font-size:13px" onchange="loadDoctors()">
          <option value="">All Hospitals</option>
        </select>
        <select id="filter-availability" class="form-control" style="width:auto;padding:6px 28px 6px 10px;font-size:13px" onchange="loadDoctors()">
          <option value="">All Availability</option>
          <option value="true">Available Now</option>
          <option value="false">Unavailable</option>
        </select>
      </div>
    </div>

    <div class="grid-2" id="doctors-grid">
      ${[1,2,3,4].map(() => `<div class="card" style="padding:20px"><div style="display:flex;gap:16px"><div class="skeleton" style="width:64px;height:64px;border-radius:16px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton" style="height:18px;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:60%;margin-bottom:6px"></div><div class="skeleton" style="height:12px;width:80%"></div></div></div></div>`).join('')}
    </div>

    <div id="pagination" class="pagination" style="margin-top:32px"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  const user = Auth.getUser();
  document.getElementById('navbar-root').innerHTML = UI.renderNavbar('👨‍⚕️ Doctors');

  const limit = 12;
  let currentPage = 0;

  async function loadHospitalsForFilter() {
    try {
      const res = await Api.getHospitals({ limit: 100 });
      const select = document.getElementById('filter-hospital');
      res.hospitals.forEach(h => {
        const opt = document.createElement('option');
        opt.value = h.id; opt.textContent = h.hospital_name;
        select.appendChild(opt);
      });
    } catch {}
  }

  async function loadDoctors(page = 0) {
    currentPage = page;
    const search = document.getElementById('search-input').value.trim();
    const hospitalId = document.getElementById('filter-hospital').value;
    const availability = document.getElementById('filter-availability').value;
    const grid = document.getElementById('doctors-grid');
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center"><div class="spinner"></div></div>`;
    try {
      const params = { limit, skip: page * limit };
      if (search) params.specialization = search;
      if (hospitalId) params.hospital_id = hospitalId;
      if (availability) params.availability = availability;

      const res = await Api.getDoctors(params);
      document.getElementById('results-count').textContent = `${res.total} doctor${res.total !== 1 ? 's' : ''} found`;

      if (!res.doctors.length) {
        grid.innerHTML = `<div style="grid-column:1/-1"><div class="empty-state"><div class="icon">👨‍⚕️</div><h3>No doctors found</h3><p>Try adjusting your filters</p></div></div>`;
        return;
      }
      const showBook = user && user.role === 'patient';
      grid.innerHTML = res.doctors.map(d => renderDoctorCard(d, showBook)).join('');

      const pages = Math.ceil(res.total / limit);
      const pag = document.getElementById('pagination');
      pag.innerHTML = pages > 1 ? Array.from({length: pages}, (_, i) =>
        `<button class="page-btn ${i === page ? 'active' : ''}" onclick="loadDoctors(${i})">${i + 1}</button>`
      ).join('') : '';
    } catch (err) {
      grid.innerHTML = `<div style="grid-column:1/-1"><div class="alert alert-danger">Failed to load doctors: ${err.message}</div></div>`;
    }
  }

  document.getElementById('search-input').addEventListener('input', UI.debounce(() => loadDoctors(), 400));
  document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') loadDoctors(); });

  loadHospitalsForFilter();
  loadDoctors();
</script>
</body>
</html>
